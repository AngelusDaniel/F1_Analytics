services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: f1
      POSTGRES_PASSWORD: f1
      POSTGRES_DB: f1
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://f1:f1@db:5432/f1
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata:
